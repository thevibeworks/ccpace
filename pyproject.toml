[project]
name = "ccpace"
version = "0.10.0"
description = "Claude and Codex usage calendar: accounts, quota windows, history, forecasts, and alerts in your terminal"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "thevibeworks" }]
requires-python = ">=3.11"
dependencies = ["httpx[socks]", "textual>=8.2,<9"]
keywords = ["claude", "claude-code", "codex", "usage", "quota", "calendar", "rate-limit"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://thevibeworks.github.io/ccpace/"
Repository = "https://github.com/thevibeworks/ccpace"
Changelog = "https://github.com/thevibeworks/ccpace/blob/main/CHANGELOG.md"

[project.scripts]
ccpace = "ccpace:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ccpace.py", "ccpace_calendar.py", "ccpace_providers.py", "ccpace_tui.py"]

[tool.hatch.build.targets.sdist]
include = ["ccpace.py", "ccpace_calendar.py", "ccpace_providers.py", "ccpace_tui.py", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "DESIGN.md", "llms.txt", "docs", "site", ".claude-plugin", "t", "Makefile", "bin"]

[tool.pytest.ini_options]
testpaths = ["t"]
